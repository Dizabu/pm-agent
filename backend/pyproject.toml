[project]
name = "pm-agent"
version = "0.1.0"
description = "A small virtual project manager agent: FastAPI + LLM + MCP tools + SSE streaming"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.4",
    "anthropic>=0.40",
    "httpx>=0.27",
    "mcp>=2.3.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
