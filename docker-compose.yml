services:
  ollama:
    image: ollama/ollama
    volumes:
      - ollama-models:/root/.ollama

  backend:
    build: ./backend
    env_file:
      - path: .env
        required: false
    environment:
      OLLAMA_URL: http://ollama:11434
      TASKS_FILE: /data/tasks.json
    volumes:
      - tasks-data:/data
    depends_on:
      - ollama

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  ollama-models:
  tasks-data: